name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev --group quality

      - name: Format check
        run: uv run ruff format --check --diff minigun tests scripts

      - name: Import sort check
        run: uv run ruff check --select I minigun tests scripts

      - name: Lint check
        run: uv run ruff check minigun tests scripts

      - name: Run tests with coverage
        run: uv run coverage run -m minigun.cli --time-budget 60

      - name: Coverage report
        run: uv run coverage report --show-missing --fail-under=60

  build_distribution:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Build distribution
        run: uv build --sdist

      - name: Upload distribution
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sdist
          path: ./dist/*.tar.gz

  check_distribution:
    name: Check distribution
    needs: [build_distribution]
    runs-on: ubuntu-latest

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Set up Python
        run: uv python install

      - name: Download distribution
        uses: actions/download-artifact@v8.0.1
        with:
          name: sdist
          path: ./dist

      - name: Test the distribution
        run: |
          uv venv
          find ./dist/*.tar.gz -maxdepth 1 -type f | xargs uv pip install
          uv run python -c "import minigun, sys; print(minigun.__version__); sys.exit(0)"
