name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: github.repository == 'soren-n/minigun-py'

    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Set up Python
        run: uv python install

      - name: Install Python Semantic Release
        run: uv tool install python-semantic-release

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Python Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUMP=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.version_bump }}" != "auto" ]; then
            BUMP="--${{ github.event.inputs.version_bump }}"
          fi

          BEFORE=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          uv tool run python-semantic-release version $BUMP --no-push
          AFTER=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)

          # semantic-release exits 0 when no release is due, so detect a
          # release by the version actually changing rather than by exit code.
          if [ "$BEFORE" != "$AFTER" ]; then
            git push origin main --follow-tags
            echo "released=true" >> $GITHUB_OUTPUT
            echo "version=$AFTER" >> $GITHUB_OUTPUT
            echo "tag=v$AFTER" >> $GITHUB_OUTPUT
          else
            echo "No version change from $BEFORE; skipping publish"
            echo "released=false" >> $GITHUB_OUTPUT
          fi

  build_and_publish:
    name: Build and Publish
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Set up Python
        run: uv python install

      - name: Build distribution
        run: uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: ./dist/

      - name: Publish to PyPI
        run: uv publish --token ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view ${{ needs.release.outputs.tag }} > /dev/null 2>&1; then
            echo "Release ${{ needs.release.outputs.tag }} already exists, updating assets..."
            gh release upload ${{ needs.release.outputs.tag }} ./dist/* --clobber
          else
            echo "Creating new release ${{ needs.release.outputs.tag }}..."
            gh release create ${{ needs.release.outputs.tag }} \
              --title "Release ${{ needs.release.outputs.version }}" \
              --generate-notes \
              ./dist/*
          fi
