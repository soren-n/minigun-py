name: Release

# Versions are managed by hand: bump with `uv version --bump`, give the
# Unreleased section of CHANGELOG.md the new version, merge, then push a
# tag vX.Y.Z on that commit. The tag must match the version in
# pyproject.toml and have a changelog entry, or nothing is published.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    if: github.repository == 'soren-n/minigun-py'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python
        run: uv python install

      - name: Check the tag against the version and changelog
        run: |
          VERSION=$(uv version --short)
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${VERSION} in pyproject.toml"
            exit 1
          fi
          awk -v heading="## v${VERSION} " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no entry for v${VERSION}"
            exit 1
          fi

      - name: Build distribution
        run: uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: ./dist/

      - name: Publish to PyPI
        run: uv publish --token ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Release ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            ./dist/*
