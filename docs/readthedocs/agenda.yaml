# Tickle agenda file
procs:
  update: [make, html]
flows:
  default: [[update]]
tasks:
- desc: Build HTML
  proc: update
  flows: [default]
  args: {}
  inputs:
  - source/index.rst
  - source/minigun.rst
  - source/reference.rst
  - source/tutorial.rst
  - ../minigun/__init__.py
  - ../minigun/arbitrary.py
  - ../minigun/budget.py
  - ../minigun/canonical.py
  - ../minigun/cardinality.py
  - ../minigun/cli.py
  - ../minigun/fixture.py
  - ../minigun/generate.py
  - ../minigun/orchestrator.py
  - ../minigun/parallel.py
  - ../minigun/regressions.py
  - ../minigun/reporter.py
  - ../minigun/search.py
  - ../minigun/shrink.py
  - ../minigun/specify.py
  - ../minigun/stateful.py
  - ../minigun/stream.py
  outputs:
  - build/html/index.html
